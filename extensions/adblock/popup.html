<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Ad Blocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <section class="site">
    <div id="host" class="host">-</div>
    <div id="count" class="count">이 탭에서 적용된 규칙: -</div>
    <label class="switch"><input type="checkbox" id="siteOn"><span>이 사이트에서 광고 차단</span></label>
  </section>

  <section>
    <label class="switch"><input type="checkbox" id="globalOn"><span>광고 차단 켜기 (전체)</span></label>
    <div id="lists"></div>
  </section>

  <p id="info" class="hint"></p>
  <p id="warn" class="warn" hidden></p>
  <script src="adblock.js"></script>
  <script src="popup.js"></script>
</body>
</html>
