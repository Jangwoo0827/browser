<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>광고 차단</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #0f172a; --muted: #64748b; --card: #f1f5f9; --line: #e2e8f0;
      --accent: #16a34a; --accent-2: #0d9488; --accent-soft: #dcfce7; --off: #cbd5e1; --warn: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220; --fg: #e2e8f0; --muted: #94a3b8; --card: #141d2f; --line: #1e293b;
        --accent: #22c55e; --accent-2: #14b8a6; --accent-soft: #052e1a; --off: #334155; --warn: #f87171;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    [hidden] { display: none !important; }
    body { width: 320px; background: var(--bg); color: var(--fg);
           font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }

    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px;
             border-bottom: 1px solid var(--line); }
    header img { width: 32px; height: 32px; }
    header .title { flex: 1; min-width: 0; }
    header h1 { font-size: 14px; font-weight: 650; }
    header .sub { font-size: 11.5px; color: var(--muted); }
    body.off header .sub { color: var(--warn); }

    .switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--off); border-radius: 26px;
              cursor: pointer; transition: background .2s; }
    .slider::before { content: ""; position: absolute; width: 22px; height: 22px; left: 2px; top: 2px;
                      background: #fff; border-radius: 50%; transition: transform .2s;
                      box-shadow: 0 1px 3px rgba(0,0,0,.25); }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider::before { transform: translateX(18px); }
    input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }

    main { padding: 16px; display: grid; gap: 12px; }

    .hero { text-align: center; padding: 18px 12px 14px; border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
            transition: filter .2s; }
    body.off .hero { filter: grayscale(1) opacity(.6); }
    .hero .count { font-size: 38px; font-weight: 750; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .hero .label { font-size: 12px; opacity: .9; }

    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tile { background: var(--card); border-radius: 10px; padding: 10px 8px; text-align: center; }
    .tile b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
    .tile span { font-size: 11px; color: var(--muted); }

    .card { background: var(--card); border-radius: 12px; padding: 12px; }
    .card h2 { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase;
               letter-spacing: .04em; margin-bottom: 8px; }
    .list { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
    .list + .list { border-top: 1px solid var(--line); }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px;
           background: var(--off); vertical-align: middle; }
    .dot.ok { background: var(--accent); }
    .dot.err { background: var(--warn); }
    .list .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
    .meta { font-size: 11.5px; color: var(--muted); margin-top: 8px; }

    .option { display: flex; align-items: center; gap: 12px; }
    .option b { display: block; font-size: 12.5px; font-weight: 600; }
    .option span { display: block; font-size: 11px; color: var(--muted); }
    .site b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site > div { flex: 1; min-width: 0; }
    .site.off span { color: var(--warn); }
    .switch.small { width: 36px; height: 22px; }
    .switch.small .slider::before { width: 18px; height: 18px; }
    .switch.small input:checked + .slider::before { transform: translateX(14px); }

    .actions { display: flex; gap: 8px; }
    button { flex: 1; font: inherit; font-weight: 550; padding: 8px 10px; border-radius: 9px;
             border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { filter: brightness(1.08); }
    button:disabled { opacity: .6; cursor: progress; }
  </style>
  <link rel="stylesheet" href="../../ui/tokens.css">
  <style>
    :root {
      --bg: var(--fj-color-bg-surface); --fg: var(--fj-color-text-primary); --muted: var(--fj-color-text-muted);
      --card: var(--fj-color-bg-canvas); --line: var(--fj-color-border-subtle);
      --accent: var(--fj-color-accent-primary); --accent-2: var(--fj-color-accent-secondary); --accent-soft: var(--fj-color-accent-soft);
      --off: var(--fj-color-border-strong); --warn: var(--fj-color-state-danger);
    }
    body { width: auto; min-width: 280px; font-family: var(--fj-font); }
  </style>
</head>
<body>
  <header>
    <img src="../../icons/icon48.png" alt="">
    <div class="title">
      <h1>광고 · 추적 차단</h1>
      <div class="sub" id="status">보호 중</div>
    </div>
    <label class="switch" title="차단 켜기/끄기">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </header>

  <main>
    <section class="card option site" id="siteCard" hidden>
      <div>
        <b id="siteName">—</b>
        <span id="siteStatus">이 사이트에서 차단 중</span>
      </div>
      <label class="switch small" title="이 사이트에서 차단 켜기/끄기">
        <input type="checkbox" id="siteToggle" checked>
        <span class="slider"></span>
      </label>
    </section>

    <section class="hero">
      <div class="count" id="total">0</div>
      <div class="label">차단한 광고·추적기</div>
    </section>

    <section class="tiles">
      <div class="tile"><b id="network">0</b><span>요청</span></div>
      <div class="tile"><b id="cosmetic">0</b><span>요소</span></div>
      <div class="tile"><b id="youtube">0</b><span>YouTube</span></div>
    </section>

    <section class="card">
      <h2>필터 목록</h2>
      <div id="lists"></div>
      <div class="meta" id="meta">아직 받지 않았어요</div>
    </section>

    <section class="card option">
      <div>
        <b>쿠키 배너·A/B 테스트 차단</b>
        <span>동의 팝업, Optimizely, LaunchDarkly 등 — 일부 사이트가 깨질 수 있어요</span>
      </div>
      <label class="switch small">
        <input type="checkbox" id="consent" checked>
        <span class="slider"></span>
      </label>
    </section>

    <section class="card option">
      <div>
        <b>엄격 모드</b>
        <span>YouTube/Facebook/Instagram API와 JW Player를 해당 사이트 밖에서 차단해요 — 임베드와 "Facebook으로 로그인"이 깨질 수 있어요</span>
      </div>
      <label class="switch small">
        <input type="checkbox" id="strict" checked>
        <span class="slider"></span>
      </label>
    </section>

    <section class="actions">
      <button class="primary" id="update">목록 업데이트</button>
      <button id="reset">통계 초기화</button>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
