<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude 설치</title>
  <link rel="stylesheet" href="../../ui/tokens.css">
  <link rel="stylesheet" href="../../ui/base.css">
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <main>
    <h1 class="fj-title-page">Claude를 사용하려면 확장을 설치하세요</h1>
    <p>Claude 확장을 설치하면 사이드 패널에서 Claude와 대화하고, 탭 읽기·클릭 같은 브라우저 제어를 쓸 수 있어요.
       확장은 Chrome 웹스토어에서 직접 설치합니다.</p>

    <p id="status" role="status">확인하는 중…</p>

    <div class="row">
      <a id="install" class="fj-btn fj-btn--primary" target="_blank" rel="noopener"
         href="https://chromewebstore.google.com/detail/claude/fcoeoabgfenejglbffodgkkbkcdhcgfn">웹스토어에서 설치</a>
      <button id="later" class="fj-btn">나중에</button>
      <button id="never" class="fj-btn fj-btn--ghost">다시 묻지 않기</button>
    </div>

    <p class="hint">설치 후 로그인하면 끝이에요. Claude Code 연동(<code>/chrome</code>)은 docs/progress.md의 안내를 참고하세요.</p>
  </main>
  <script type="module" src="welcome.js"></script>
</body>
</html>
