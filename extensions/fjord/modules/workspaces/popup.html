<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>워크스페이스</title>
  <link rel="stylesheet" href="../../ui/tokens.css">
  <link rel="stylesheet" href="../../ui/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1 class="fj-title-section">워크스페이스</h1>
  <p class="fj-caption lead">워크스페이스마다 창이 따로 있어서 위쪽 탭 줄에는 그 워크스페이스의 탭만 보여요. 아이콘을 눌러 모양을 바꿀 수 있어요.</p>
  <ul id="list"></ul>
  <form id="add">
    <input id="name" class="fj-field" placeholder="새 워크스페이스 이름" maxlength="24" autocomplete="off">
    <button type="submit" class="fj-btn fj-btn--primary">추가</button>
  </form>
  <p id="msg" class="fj-caption msg" role="status"></p>
  <p class="fj-micro hint">Alt + Q 로 다음 워크스페이스로 전환</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
