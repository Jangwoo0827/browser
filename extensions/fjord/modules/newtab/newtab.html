<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>새 탭</title>
  <link rel="stylesheet" href="../../ui/tokens.css">
  <link rel="stylesheet" href="../../ui/base.css">
  <link rel="stylesheet" href="newtab.css">
  <link rel="stylesheet" href="../rail/rail.css">
</head>
<body>
  <header id="top">
    <img class="logo" src="../../icons/icon32.png" alt="" width="24" height="24">
    <span class="wordmark">Fjord</span>
  </header>

  <main>
    <section id="hero">
      <p id="greeting"></p>
      <div id="clock" aria-hidden="true"></div>
      <p id="date"></p>
    </section>

    <form id="search" autocomplete="off" role="search">
      <span id="searchIcon"></span>
      <input id="q" type="text" placeholder="검색어 또는 주소 입력" aria-label="검색 또는 주소 입력" autofocus>
      <kbd id="slash" aria-hidden="true">/</kbd>
    </form>

    <nav id="chips" aria-label="워크스페이스"></nav>

    <section id="openTabsWrap" hidden>
      <h2 class="strip-title">열린 탭 <span>눌러서 이동 · +로 스피드 다이얼에 추가</span></h2>
      <div id="openTabs"></div>
    </section>

    <div id="grid" role="list"></div>

    <section id="cards" hidden>
      <article class="card" id="cardHistory" hidden>
        <header><h2>최근 방문</h2><button type="button" class="more" data-pane="@history">더 보기</button></header>
        <div class="card-list" id="listHistory"></div>
      </article>
      <article class="card" id="cardBookmarks" hidden>
        <header><h2>북마크</h2><button type="button" class="more" data-pane="@bookmarks">더 보기</button></header>
        <div class="card-list" id="listBookmarks"></div>
      </article>
    </section>
  </main>

  <button id="custBtn" type="button" class="cust-btn" aria-haspopup="dialog" aria-expanded="false"></button>
  <section id="custPanel" class="cust-panel" role="dialog" aria-label="새 탭 맞춤설정" hidden></section>

  <dialog id="dlg">
    <form method="dialog" id="dlgForm">
      <h2 id="dlgTitle" class="fj-title-section">사이트 추가</h2>
      <label class="fj-caption">이름<input id="dName" class="fj-field" maxlength="40" required></label>
      <label class="fj-caption">주소<input id="dUrl" class="fj-field" placeholder="예: claude.ai" required></label>
      <p id="dMsg" class="fj-caption" role="status"></p>
      <div class="row">
        <button type="button" id="dCancel" class="fj-btn">취소</button>
        <button type="submit" class="fj-btn fj-btn--primary">저장</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="newtab.js"></script>
</body>
</html>
