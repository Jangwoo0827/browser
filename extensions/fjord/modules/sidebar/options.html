<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fjord 설정</title>
  <link rel="stylesheet" href="../../ui/tokens.css">
  <link rel="stylesheet" href="../../ui/base.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1 class="fj-title-page">화면 가장자리 레일</h1>
    <p class="fj-caption lead">웹페이지 가장자리에 항상 보이는 아이콘 줄이에요. 아이콘을 누르면 사이드 패널에서 열려요.</p>
    <div class="card rail-settings">
      <label class="fj-row"><span class="fj-row__grow">레일 표시</span><span class="fj-toggle"><input id="railOn" type="checkbox"><span class="fj-toggle__track"></span></span></label>
      <label class="fj-row"><span class="fj-row__grow">위치</span>
        <select id="railSide" class="fj-field"><option value="left">왼쪽</option><option value="right">오른쪽</option></select>
      </label>
    </div>

    <h1 class="fj-title-page">사이드바 항목</h1>
    <p class="fj-caption lead">자주 쓰는 사이트와 웹앱을 추가하세요. 아이콘을 누르면 사이드 패널에 열려요.</p>

    <ul id="list" class="card"></ul>

    <form id="add">
      <input id="name" class="fj-field" placeholder="이름 (예: Claude)" maxlength="40" required>
      <input id="url" class="fj-field" placeholder="주소 (예: claude.ai)" required>
      <button type="submit" class="fj-btn fj-btn--primary">추가</button>
    </form>
    <p id="msg" class="fj-caption msg" role="status"></p>

    <p class="fj-caption">일부 사이트는 로그인 쿠키 정책이나 프레임 차단 때문에 패널 안에서 제대로 동작하지 않을 수 있어요. 그럴 땐 패널 위쪽 ↗ 버튼으로 새 탭에서 여세요.</p>
    <button id="reset" class="fj-btn fj-btn--ghost">기본 항목으로 되돌리기</button>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
