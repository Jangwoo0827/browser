<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fjord</title>
  <link rel="stylesheet" href="../../ui/tokens.css">
  <link rel="stylesheet" href="../../ui/base.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <aside id="rail" aria-label="사이드바">
    <button id="toggle" class="rail-btn" title="사이드바 접기/펼치기" aria-label="사이드바 접기/펼치기">
      <span class="rail-glyph" id="toggleIcon"></span><span class="rail-label">접기</span>
    </button>
    <div id="items" class="rail-group"></div>
    <div class="rail-spacer"></div>
    <div class="rail-divider"></div>
    <div id="builtins" class="rail-group"></div>
    <button id="settings" class="rail-btn" title="사이트 추가/삭제 (설정)" aria-label="설정">
      <span class="rail-glyph" id="settingsIcon"></span><span class="rail-label">설정</span>
    </button>
  </aside>
  <main id="view">
    <header id="bar">
      <span id="title" class="fj-label">사이트를 선택하세요</span>
      <button id="reload" class="bar-btn" title="새로고침" aria-label="새로고침"></button>
      <button id="external" class="bar-btn" title="새 탭에서 열기" aria-label="새 탭에서 열기"></button>
    </header>
    <div id="empty">
      <p class="fj-title-section">사이트를 선택하세요</p>
      <p class="fj-caption">왼쪽 아이콘을 눌러 사이트를 열어요.<br>사이트는 설정에서 추가하거나 지울 수 있어요.</p>
    </div>
    <iframe id="frame" hidden allow="clipboard-read; clipboard-write; fullscreen; autoplay; microphone; camera"></iframe>
  </main>
  <script type="module" src="panel.js"></script>
</body>
</html>
