<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fjord</title>
  <link rel="stylesheet" href="../../ui/tokens.css">
  <link rel="stylesheet" href="../../ui/base.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header id="switcher">
    <nav id="tabs" role="tablist" aria-label="패널"></nav>
    <button id="settings" class="ibtn" title="사이트 추가/삭제 (설정)" aria-label="설정"></button>
  </header>
  <main id="view">
    <section id="pane" hidden></section>
    <header id="bar" hidden>
      <span id="title" class="fj-label"></span>
      <button id="reload" class="ibtn" title="새로고침" aria-label="새로고침"></button>
      <button id="external" class="ibtn" title="새 탭에서 열기" aria-label="새 탭에서 열기"></button>
    </header>
    <iframe id="frame" hidden allow="clipboard-read; clipboard-write; fullscreen; autoplay; microphone; camera"></iframe>
  </main>
  <script type="module" src="panel.js"></script>
</body>
</html>
