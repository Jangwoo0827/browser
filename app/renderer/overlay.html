<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>overlay</title>
  <link rel="stylesheet" href="fjord://shared/tokens.css">
  <link rel="stylesheet" href="fjord://shared/base.css">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!-- address suggestions -->
  <div id="suggest" class="card" hidden><ul id="suggestList"></ul></div>

  <!-- find in page -->
  <div id="find" class="card find" hidden>
    <input id="findInput" class="fj-field" placeholder="페이지에서 찾기" spellcheck="false" autocomplete="off">
    <span id="findCount" class="fj-caption"></span>
    <button id="findPrev" class="mini" title="이전 (Shift+Enter)" aria-label="이전"></button>
    <button id="findNext" class="mini" title="다음 (Enter)" aria-label="다음"></button>
    <button id="findClose" class="mini" title="닫기 (Esc)" aria-label="닫기"></button>
  </div>

  <!-- ad blocker -->
  <div id="shield" class="card shield" hidden>
    <div class="sh-head"><span id="shIcon"></span><div><div class="sh-title">광고·추적 차단</div><div id="shStatus" class="fj-caption"></div></div><button id="shSwitch" class="switch" role="switch" aria-label="광고·추적 차단"></button></div>
    <div class="sh-count"><b id="shAds">0</b><span class="fj-caption">이 페이지에서 차단함 · 총 <span id="shTotal">0</span>개</span></div>
    <div class="sh-row"><span id="shHost" class="n"></span><button id="shSite" class="fj-btn">이 사이트에서 끄기</button></div>
    <div class="sh-row"><span class="fj-caption" id="shList"></span><button id="shUpdate" class="fj-btn">업데이트</button></div>
    <p id="shMsg" class="fj-caption"></p>
  </div>

  <!-- permission request -->
  <div id="permission" class="card perm" hidden>
    <p id="permTitle" class="perm-title"></p>
    <p id="permSub" class="fj-caption"></p>
    <div class="row">
      <button id="permDeny" class="fj-btn">차단</button>
      <button id="permOnce" class="fj-btn">이번만 허용</button>
      <button id="permAllow" class="fj-btn fj-btn--primary">허용</button>
    </div>
  </div>

  <!-- site info -->
  <div id="siteinfo" class="card site" hidden>
    <div class="site-head"><span id="siteIcon"></span><div><div id="siteOrigin" class="site-origin"></div><div id="siteStatus" class="fj-caption"></div></div></div>
    <div id="siteRows"></div>
  </div>

  <!-- blocked popups -->
  <div id="popups" class="card pops" hidden>
    <h2 class="fj-title-section">팝업이 차단됐어요</h2>
    <ul id="popList"></ul>
    <button id="popAllow" class="fj-btn">이 사이트의 팝업 항상 허용</button>
  </div>

  <!-- bookmark edit -->
  <form id="bookmark" class="card bmedit" hidden>
    <h2 class="fj-title-section">북마크</h2>
    <label class="fj-caption">이름<input id="bmName" class="fj-field" autocomplete="off"></label>
    <label class="fj-caption">폴더<select id="bmFolder" class="fj-field"></select></label>
    <div class="row">
      <button type="button" id="bmRemove" class="fj-btn">삭제</button>
      <button type="submit" class="fj-btn fj-btn--primary">완료</button>
    </div>
  </form>

  <!-- tab search -->
  <div id="tabsearch" class="card tabsearch" hidden>
    <input id="tsInput" class="fj-field" placeholder="열려 있는 탭 검색 (제목 또는 주소)" spellcheck="false" autocomplete="off">
    <ul id="tsList"></ul>
    <p id="tsEmpty" class="fj-caption empty" hidden>일치하는 탭이 없어요.</p>
  </div>

  <!-- text prompt -->
  <form id="prompt" class="card prompt" hidden>
    <h2 id="promptTitle" class="fj-title-section"></h2>
    <input id="promptInput" class="fj-field" maxlength="24" placeholder="이름" autocomplete="off" required>
    <p id="promptMsg" class="fj-caption" role="status"></p>
    <div class="row">
      <button type="button" id="promptCancel" class="fj-btn">취소</button>
      <button type="submit" class="fj-btn fj-btn--primary">확인</button>
    </div>
  </form>

  <!-- downloads -->
  <div id="downloads" class="card" hidden>
    <header><h2 class="fj-title-section">다운로드</h2><button id="dlClear" class="fj-btn fj-btn--ghost">목록 지우기</button></header>
    <ul id="dlList"></ul>
    <p id="dlEmpty" class="fj-caption empty">받은 파일이 없어요.</p>
  </div>

  <script type="module" src="overlay.js"></script>
</body>
</html>
