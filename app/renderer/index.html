<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fjord</title>
  <link rel="stylesheet" href="fjord://shared/tokens.css">
  <link rel="stylesheet" href="fjord://shared/base.css">
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <aside id="rail" aria-label="사이드바">
    <div id="spaces" class="rail-group"></div>
    <div class="rail-divider"></div>
    <div id="pins" class="rail-group"></div>
    <div class="rail-spacer"></div>
    <div class="rail-divider"></div>
    <div id="tools" class="rail-group"></div>
  </aside>

  <section id="top">
    <div id="tabs">
      <div id="tabList" role="tablist"></div>
      <button id="newTab" class="icon-btn" title="새 탭 (Ctrl+T)" aria-label="새 탭"></button>
      <button id="tabSearch" class="icon-btn" title="탭 검색 (Ctrl+Shift+A)" aria-label="탭 검색"></button>
    </div>
    <div id="toolbar">
      <button id="back" class="icon-btn" title="뒤로 (Alt+←)" aria-label="뒤로"></button>
      <button id="forward" class="icon-btn" title="앞으로 (Alt+→)" aria-label="앞으로"></button>
      <button id="reload" class="icon-btn" title="새로고침 (Ctrl+R)" aria-label="새로고침"></button>
      <button id="homeBtn" class="icon-btn" title="홈 (Alt+Home)" aria-label="홈" hidden></button>
      <form id="addr" autocomplete="off">
        <button id="secBtn" type="button" hidden></button>
        <button id="popBtn" type="button" title="차단된 팝업" aria-label="차단된 팝업" hidden></button>
        <input id="addrInput" type="text" spellcheck="false" placeholder="검색어 또는 주소 입력" aria-label="주소">
      </form>
      <button id="zoomBadge" class="zoom-badge" hidden title="확대/축소 초기화"></button>
      <button id="starBtn" class="icon-btn" title="북마크 (Ctrl+D)" aria-label="북마크"></button>
      <button id="findBtn" class="icon-btn" title="페이지에서 찾기 (Ctrl+F)" aria-label="페이지에서 찾기"></button>
      <button id="histBtn" class="icon-btn" title="방문 기록 (Ctrl+H)" aria-label="방문 기록"></button>
      <button id="dlBtn" class="icon-btn" title="다운로드 (Ctrl+J)" aria-label="다운로드"><span id="dlDot" hidden></span></button>
    </div>
    <div id="bmBar" aria-label="북마크 바"></div>
  </section>


  <script type="module" src="ui.js"></script>
</body>
</html>
